# Docker Compose for a shared stateless Streamable HTTP deployment.
# Put this service behind a TLS-terminating reverse proxy for team use.

services:
  devops-mcp:
    image: node:20-alpine
    command: npx -y -p @notharshhaa/devops-mcp@latest devops-mcp-http
    environment:
      # Stateless MCP HTTP endpoint: http://localhost:3000/mcp
      - MCP_HTTP_HOST=0.0.0.0
      - PORT=3000
      - MCP_AUTH_TOKEN=${MCP_AUTH_TOKEN:-your-shared-secret}
      - MCP_REQUEST_STATE_SECRET=${MCP_REQUEST_STATE_SECRET:-replace-with-at-least-32-random-bytes}
      - MCP_ALLOWED_HOSTS=${MCP_ALLOWED_HOSTS:-localhost,127.0.0.1,devops-mcp}
      - MCP_CACHE_TTL_MS=${MCP_CACHE_TTL_MS:-60000}

      # Kubernetes (mount kubeconfig from host)
      - KUBECONFIG=/app/kubeconfig

      # ArgoCD
      - ARGOCD_SERVER=${ARGOCD_SERVER}
      - ARGOCD_TOKEN=${ARGOCD_TOKEN}

      # Prometheus
      - PROMETHEUS_URL=${PROMETHEUS_URL}
      - PROMETHEUS_BEARER_TOKEN=${PROMETHEUS_BEARER_TOKEN}

      # PagerDuty
      - PAGERDUTY_TOKEN=${PAGERDUTY_TOKEN}

      # Safety
      - DEVOPS_MCP_DRY_RUN=${DEVOPS_MCP_DRY_RUN:-false}
      - DEVOPS_MCP_AUDIT_LOG=/var/log/devops-mcp-audit.jsonl

    volumes:
      - ${HOME}/.kube/config:/app/kubeconfig:ro
      - audit-logs:/var/log

    ports:
      - "127.0.0.1:3000:3000"

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "wget", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  audit-logs:

# Example Caddyfile:
#
# devops-mcp.example.com {
#     reverse_proxy localhost:3000
# }
#
# Set MCP_ALLOWED_HOSTS=devops-mcp.example.com,localhost before starting.
